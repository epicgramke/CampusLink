<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>EarnLink | Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <a class="brand auth-brand" href="login.html">EARN<span>LINK</span></a>
    <p class="eyebrow">JOIN EARNLINK</p>
    <h1>Create account</h1>
    <p class="muted">Create your account to start reviewing tasks.</p>

    <form id="registerForm">
      <label for="phone">Phone number</label>
      <input id="phone" type="tel" placeholder="07XXXXXXXX" autocomplete="tel" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" placeholder="Repeat your password" autocomplete="new-password" minlength="6" required>

      <button class="btn full" type="submit">Create Account</button>
      <p id="msg" class="msg"></p>
    </form>

    <p class="center">Already have an account? <a href="login.html">Login</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
