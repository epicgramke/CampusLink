<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Campus Connect Kenya — your campus, our community.">
  <title>Login | Campus Connect Kenya</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="corner corner-top" aria-hidden="true"></div>
  <div class="corner corner-bottom" aria-hidden="true"></div>

  <main class="page-shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" role="img">
          <path d="M18 40a34 34 0 0 1 64 0" class="cap-arc"/>
          <path d="M17 38 50 22 84 38 50 53Z" class="cap"/>
          <path d="M30 45v12c12 10 28 10 40 0V45" class="cap-band"/>
          <path d="M83 39v20" class="tassel"/>
          <circle cx="83" cy="62" r="3.5" class="tassel"/>
          <text x="50" y="82" text-anchor="middle" class="mark-letters">CC</text>
        </svg>
      </div>
      <div class="brand-name"><span>CAMPUS</span> CONNECT</div>
      <div class="brand-country"><span></span> K E N Y A <span></span></div>
      <p class="brand-motto">Connect <b>•</b> Buy <b>•</b> Sell <b>•</b> Share</p>
      <p class="brand-tagline">Your Campus, Our Community</p>
    </header>

    <section class="auth-card" aria-labelledby="form-title">
      <div class="card-glow" aria-hidden="true"></div>
      <div class="card-heading">
        <p class="eyebrow">WELCOME TO YOUR COMMUNITY</p>
        <h1 id="form-title">Welcome <span>Back!</span></h1>
        <p class="subtitle" id="form-subtitle">Log in to your Campus Connect account</p>
      </div>

      <form id="auth-form" novalidate>
        <label class="field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          </span>
          <span class="visually-hidden">Email address</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
        </label>

        <label class="field" id="password-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
          </span>
          <span class="visually-hidden">Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required>
          <button class="show-password" id="toggle-password" type="button" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3 3 21 21"/></svg>
          </button>
        </label>

        <div class="form-options" id="login-options">
          <label class="remember"><input id="remember" type="checkbox" checked><span class="custom-check">✓</span> Remember me</label>
          <button class="text-button" type="button" id="forgot-password">Forgot password?</button>
        </div>

        <button class="primary-button" id="submit-button" type="submit">
          <span id="submit-label">Log In</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="divider"><span></span><b>OR</b><span></span></div>

      <button class="google-button" id="google-button" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/>
          <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/>
          <path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/>
          <path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <p class="switch-mode" id="switch-copy">Don't have an account? <button type="button" id="switch-mode">Sign Up</button></p>
      <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
      <p class="security-note"><span aria-hidden="true">●</span> Secure sign-in powered by Supabase</p>
    </section>

    <footer class="footer">
      <span>© <span id="year"></span> Campus Connect Kenya</span>
      <span>Made for campus life <b>♥</b></span>
    </footer>
  </main>
</body>
</html>
